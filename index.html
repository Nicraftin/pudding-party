<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pudding Party</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Pudding Party</h1>

  <!-- HOME -->
  <div id="home" class="homewrap">
    <section id="profile" class="panel stack">
      <h2>Your character</h2>
      <div class="profilerow">
        <div class="facepreview" id="facePreview"></div>
        <div class="profilefields">
          <label for="nameInput">Your name</label>
          <input id="nameInput" type="text" maxlength="16" autocomplete="off" placeholder="Pudding McGee">
        </div>
      </div>
      <div>
        <div class="tabs" id="profileTabs" role="tablist" aria-label="Customize your character">
          <button type="button" class="tab" role="tab" id="tabFace" aria-controls="panelFace" aria-selected="true">Expression</button>
          <button type="button" class="tab" role="tab" id="tabAcc" aria-controls="panelAcc" aria-selected="false" tabindex="-1">Accessory</button>
        </div>
        <div class="tabpanel" id="panelFace" role="tabpanel" aria-labelledby="tabFace">
          <div class="swatches" id="faceOpts" role="radiogroup" aria-label="Expression"></div>
          <div class="swatches swatchrow" id="swatches" role="radiogroup" aria-label="Color"></div>
        </div>
        <div class="tabpanel hidden" id="panelAcc" role="tabpanel" aria-labelledby="tabAcc">
          <div class="swatches" id="accOpts" role="radiogroup" aria-label="Accessory"></div>
          <div class="swatches swatchrow" id="accSwatches" role="radiogroup" aria-label="Accessory color"></div>
        </div>
      </div>
    </section>
    <section id="lobbies" class="panel stack">
      <div class="row">
        <button id="createBtn">Create lobby</button>
      </div>
      <div class="row">
        <div>
          <label for="codeInput">Lobby code</label>
          <input id="codeInput" type="text" maxlength="4" autocomplete="off" placeholder="ABCD">
        </div>
        <button id="joinBtn" class="ghost">Join lobby</button>
      </div>
      <div>
        <div class="sfxrow"><label for="sfxVolHome">Sound effects volume</label><span class="sfxpct"></span></div>
        <input type="range" class="sfxVol" id="sfxVolHome" min="0" max="100" step="1" value="80">
      </div>
    </section>
  </div>

  <!-- GAME -->
  <div id="gameLayout" class="layout hidden">
  <section id="game" class="panel">
    <div class="prompt" id="promptText"></div>
    <div class="sub" id="promptSub"></div>
    <div class="timer" id="timer"><div id="timerFill"></div></div>
    <div class="turnline" id="turnLine"></div>
    <div class="wheel" id="wheel">
      <div class="pudding" id="pudding">
        <svg viewBox="10 40 100 72" aria-hidden="true">
          <defs><clipPath id="pudClip"><path d="M28 100 L36 52 Q60 46 84 52 L92 100 Q60 110 28 100Z"/></clipPath></defs>
          <path d="M28 100 L36 52 Q60 46 84 52 L92 100 Q60 110 28 100Z" fill="#ffd98a"/>
          <g clip-path="url(#pudClip)">
            <path d="M20 40 H100 V60 L87 60 C87 66 82 66 81 60 C80 70 74 70 73 62 C70 68 64 68 63 61 C61 70 54 70 53 61 C50 67 44 67 43 60 C41 67 34 67 33 60 L20 60Z" fill="#b5651d"/>
            <rect x="20" y="40" width="80" height="75" fill="#ff2a00" opacity="0" id="pudTint"/>
          </g>
          <path d="M28 100 L36 52 Q60 46 84 52 L92 100 Q60 110 28 100Z" fill="none" stroke="#e0a63c" stroke-width="2" stroke-linejoin="round"/>
          <g id="eyes">
          <circle cx="47" cy="80" r="9" fill="#fff"/><circle cx="73" cy="80" r="9" fill="#fff"/>
          <g class="pupils" id="pupils"><circle cx="47" cy="80" r="4.5" fill="#2a1204"/><circle cx="73" cy="80" r="4.5" fill="#2a1204"/></g>
          </g>
          <line id="browL" x1="37" y1="68" x2="56" y2="70" stroke="#2a1204" stroke-width="3.2" stroke-linecap="round" opacity="0"/>
          <line id="browR" x1="83" y1="68" x2="64" y2="70" stroke="#2a1204" stroke-width="3.2" stroke-linecap="round" opacity="0"/>
          <path id="pudMouth" d="M54 94 Q60 99 66 94" fill="none" stroke="#b5651d" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="announce hidden" id="announce">
        <div class="label">NEW THEME</div>
        <div class="theme" id="annTheme"></div>
        <p class="asub" id="annSub"></p>
      </div>
    </div>
    <div class="dym hidden" id="dym" role="status"></div>
    <div class="row" id="answerRow">
      <input id="answerInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer" aria-label="Your answer">
      <button id="answerBtn" style="flex:0 0 auto">Submit</button>
    </div>
    <div class="log" id="eventLog"></div>
  </section>
  <aside class="panel stack side" id="lobbyBox">
      <div class="lobbyhead">
        <div>
          <div class="codelabel">Lobby code (click to copy)</div>
          <div class="code" id="lobbyCode" title="Copy code"></div>
        </div>
        <button id="leaveBtn" class="ghost">Leave</button>
      </div>
      <button id="ringBtn" class="ringbtn">Join the ring</button>
      <button id="startNowBtn" class="ringbtn startnow hidden">Start now</button>
      <div>
        <h2>Players</h2>
        <ul class="players" id="lobbyPlayers"></ul>
      </div>
      <div class="settingsCard voteCard hidden" id="voteCard">
        <h3>Extra life vote</h3>
        <div id="voteIdle">
          <label for="voteTarget">Give an extra life to</label>
          <select id="voteTarget"></select>
          <button id="voteCallBtn" style="margin-top:10px;width:100%">Call vote</button>
          <div class="sethint">Everyone still in the match must agree.</div>
        </div>
        <div id="voteActive" class="hidden">
          <div id="voteText" class="votetext"></div>
          <div class="sethint" id="voteCount"></div>
          <div class="row" id="voteBtns" style="margin-top:10px">
            <button id="voteYesBtn">Agree</button>
            <button id="voteNoBtn" class="ghost">Decline</button>
          </div>
        </div>
      </div>
      <div class="settingsCard voteCard hidden" id="skipCard">
        <h3>Skip prompt vote</h3>
        <div id="skipIdle">
          <button id="skipCallBtn" style="width:100%">Vote to skip prompt</button>
          <div class="sethint">Everyone still in the match must agree.</div>
        </div>
        <div id="skipActive" class="hidden">
          <div id="skipText" class="votetext"></div>
          <div class="sethint" id="skipCount"></div>
          <div class="row" id="skipBtns" style="margin-top:10px">
            <button id="skipYesBtn">Agree</button>
            <button id="skipNoBtn" class="ghost">Decline</button>
          </div>
        </div>
      </div>
      <div class="settingsCard" id="soundCard">
        <h3>Sound</h3>
        <div class="sfxrow"><label for="sfxVolGame">Sound effects volume</label><span class="sfxpct"></span></div>
        <input type="range" class="sfxVol" id="sfxVolGame" min="0" max="100" step="1" value="80">
      </div>
      <div class="settingsCard" id="settingsCard">
        <h3>Match settings</h3>
        <div class="setgrid">
          <div><label for="livesInput">Lives</label><input id="livesInput" type="number" min="1" max="10" value="3" inputmode="numeric"></div>
          <div><label for="secsInput">Turn length</label><input id="secsInput" type="number" min="3" max="60" value="15" inputmode="numeric"></div>
          <div><label for="lifePtsInput">Extra life score</label><input id="lifePtsInput" type="number" min="10" max="5000" step="10" value="500" inputmode="numeric"></div>
          <div><label for="modeInput">Mode</label><select id="modeInput"><option value="sulka">Sulka</option><option value="social">Social Craft</option></select></div>
        </div>
        <div class="sethint" id="setHint"></div>
      </div>
  </aside>
  </div>
</main>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="matching.js"></script>
<script src="character.js"></script>
<script src="prompt-list.js"></script>
<script src="prompts.js"></script>
<script src="game.js"></script>
</body>
</html>
